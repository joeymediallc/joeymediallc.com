<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Joey Media LLC</title>
  <meta name="description" content="Joey Media LLC" />

  <meta property="og:title" content="Joey Media LLC" />
  <meta property="og:description" content="Joey Media LLC" />
  <meta property="og:type" content="website" />

  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%230b0d10%22/><text x=%2250%22 y=%2268%22 font-size=%2258%22 font-family=%22Georgia,serif%22 fill=%22%23e8eaed%22 text-anchor=%22middle%22>J</text></svg>" />

  <style>
    :root {
      --bg: #0b0d10;
      --text: #ededf0;
      --muted: #7c828e;
      --line: #1d212a;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      /* subtle depth */
      background-image:
        radial-gradient(1200px 600px at 50% -10%, rgba(255,255,255,0.045), transparent 70%);
    }
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem 1.25rem;
    }
    .wordmark {
      margin: 0;
      font-weight: 600;
      letter-spacing: -0.02em;
      line-height: 1.05;
      font-size: clamp(2.4rem, 9vw, 4.75rem);
    }
    .wordmark .llc {
      display: block;
      margin-top: 0.4rem;
      font-size: 0.28em;
      font-weight: 500;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .rule {
      width: 44px;
      height: 2px;
      background: var(--line);
      border: 0;
      margin: 2rem auto 1.5rem;
    }
    .tagline {
      margin: 0 auto;
      max-width: 34ch;
      color: var(--muted);
      font-size: clamp(1rem, 2.5vw, 1.15rem);
      line-height: 1.6;
    }
    footer {
      text-align: center;
      color: var(--muted);
      font-size: 0.8rem;
      letter-spacing: 0.04em;
      padding: 1.5rem 1.25rem 2rem;
    }
  </style>
</head>
<body>
  <main>
    <h1 class="wordmark">
      Joey&nbsp;Media
      <span class="llc">LLC</span>
    </h1>

    <hr class="rule" />

    <p class="tagline">Content creation and mobile app development.</p>
  </main>

  <footer>
    &copy; <span id="year"></span> Joey Media LLC
  </footer>

  <script>
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>
</body>
</html>
